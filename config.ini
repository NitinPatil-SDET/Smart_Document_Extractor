# Smart Document Extractor Configuration

[GROQ]
# Groq OpenAI-compatible API base URL
url = https://api.groq.com/openai/v1

# LLM Model to use
model = openai/gpt-oss-20b

# Temperature for LLM (0.0 = deterministic, 1.0 = creative)
temperature = 0.1

# Maximum context size
max_tokens = 4096

# Request timeout (seconds)
timeout = 300

[EXTRACTION]
# Maximum retries for extraction
max_retries = 3

# Confidence threshold for accepting extractions
confidence_threshold = 0.7

# Enable automatic retry on failure
auto_retry = true

[PDF]
# Maximum PDF file size (MB)
max_file_size = 100

# Supported formats
supported_formats = pdf

# Enable both pdfplumber and PyMuPDF extraction
dual_extraction = true

[EXCEL]
# Excel sheet name
sheet_name = Extracted Data

# Enable auto-column width adjustment
auto_column_width = true

# Freeze header row
freeze_header = true

# Header background color
header_color = 4472C4

[LOGGING]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO

# Log file directory
log_dir = logs

# Log file format
log_format = %(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s

[PATHS]
# Upload directory
upload_dir = uploads

# Output directory
output_dir = outputs

# Data directory
data_dir = data
